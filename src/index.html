<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b32">
<meta name="robots" content="noindex,nofollow">
<title>Website Under Construction | The Metcalfe &amp; Kavanagh Family</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#f5f0e4;color:#173b32}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#fffdf7 0,#f5f0e4 58%,#e8dfcb 100%)}
  main{width:min(680px,100%);text-align:center;padding:54px 32px;border:1px solid rgba(23,59,50,.22);border-radius:18px;background:rgba(255,253,247,.9);box-shadow:0 18px 55px rgba(23,59,50,.10)}
  .mark{width:58px;height:58px;margin:0 auto 22px;border:2px solid #173b32;border-radius:50%;display:grid;place-items:center;font-size:29px}
  h1{font-size:clamp(34px,7vw,56px);line-height:1.02;margin:0 0 20px;font-weight:700}
  p{font-family:Arial,Helvetica,sans-serif;font-size:clamp(17px,3vw,20px);line-height:1.6;margin:0 auto;max-width:520px;color:#40594f}
  .family{margin-top:32px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#6a796f}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">⌛</div>
  <h1>Website Under Construction</h1>
  <p>Come back later for exciting updates.</p>
  <div class="family">The Metcalfe &amp; Kavanagh Family</div>
</main>
</body>
</html>
