name: Apply prominent profile life stories

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-life-story-prominence.yml'

permissions:
  contents: write

jobs:
  update-profile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update profile life-story presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          old = "  const intro = (p.biography || bits.join(' ') || `This profile currently contains limited recorded information for ${p.name}.`).split(/\\n+/)[0]\n"
          new = """  const cleanBiography = String(p.biography || '').replace(/\\\\n/g, '\\n').trim()\n  const fallbackStory = bits.join(' ') || `This profile currently contains limited recorded information for ${p.name}.`\n  const fullStory = cleanBiography || fallbackStory\n  const storyLimit = 1050\n  const storyIsLong = fullStory.length > storyLimit\n  const storyPreview = storyIsLong ? fullStory.slice(0, storyLimit).replace(/\\s+\\S*$/, '').trim() + '…' : fullStory\n  const storyPreviewHtml = `<div class=\\\"profile-intro prominent-life-story\\\">${esc(storyPreview).replace(/\\n+/g, '<br><br>')}${storyIsLong ? `<a class=\\\"chapter-record-link\\\" href=\\\"#story\\\">Continue reading ↓</a>` : ''}</div>`\n  const intro = fullStory.split(/\\n+/)[0]\n"""
          if old not in s:
              raise SystemExit('Expected intro marker not found; refusing unsafe edit')
          s = s.replace(old, new, 1)
          old_hero = '<p class=\\"profile-intro\\">${esc(intro)}</p>'
          new_hero = '${storyPreviewHtml}'
          if old_hero not in s:
              raise SystemExit('Expected hero intro marker not found; refusing unsafe edit')
          s = s.replace(old_hero, new_hero, 1)
          old_story = "${esc(p.biography || 'No personal life story has been added yet.').replace(/\\n/g, '<br>')}"
          new_story = "${esc(cleanBiography || fallbackStory).replace(/\\n+/g, '<br><br>')}"
          if old_story not in s:
              raise SystemExit('Expected Life Story marker not found; refusing unsafe edit')
          s = s.replace(old_story, new_story, 1)
          p.write_text(s)
          PY
      - name: Commit profile layout update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Make Life Story prominent on every family profile"
          git push
